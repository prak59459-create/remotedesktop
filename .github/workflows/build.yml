name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.2.3-release
          tag: 6.2.3-RELEASE
      - name: Build RDHost.exe
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test
        run: swift test
      - uses: actions/upload-artifact@v4
        with:
          name: RDHost-windows-x64
          path: dist/RDHost/

  macos-viewer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build RDViewer
        run: swift build -c release --product RDViewer
      - name: Test
        run: swift test
      - name: Package
        run: |
          mkdir -p dist
          cp "$(swift build -c release --show-bin-path)/RDViewer" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: RDViewer-macos
          path: dist/

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
